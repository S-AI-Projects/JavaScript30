<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
      <div id="clock-fallback" class="clock-fallback" role="status" aria-live="polite">
        <div class="fallback-badge">Transforms Unsupported</div>
        <div class="fallback-time">--:--:--</div>
      </div>
    </div>


  <style>
    html {
      background: #018DED url(https://unsplash.it/1500/1000?image=881&blur=5);
      background-size: cover;
      font-family: 'helvetica neue';
      text-align: center;
      font-size: 10px;
    }

    body {
      margin: 0;
      font-size: 2rem;
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
    }

    .clock {
      width: 30rem;
      height: 30rem;
      border: 20px solid white;
      border-radius: 50%;
      margin: 50px auto;
      position: relative;
      padding: 2rem;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.1),
        inset 0 0 0 3px #EFEFEF,
        inset 0 0 10px black,
        0 0 10px rgba(0,0,0,0.2);
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateY(-3px); /* account for the height of the clock hands */
    }

    .hand {
      width: 50%;
      height: 6px;
      background: black;
      position: absolute;
      top: 50%;
      transform-origin: 100%;
      transform: rotate(90deg);
      transition: all 0.05s;
      transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
    }

    .clock-fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #1a1a2e;
      font-family: monospace;
      padding: 1rem;
    }

    .fallback-badge {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d9534f;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .fallback-time {
      font-size: 2.8rem;
      font-weight: bold;
    }

    .no-transforms .clock-face {
      display: none;
    }

    .no-transforms .clock-fallback {
      display: block;
    }

    @supports not (transform: rotate(0deg)) {
      .clock-face {
        display: none;
      }
      .clock-fallback {
        display: block;
      }
    }

  </style>

  <script>
    const secondHand = document.querySelector('.second-hand');
    const minsHand = document.querySelector('.min-hand');
    const hourHand = document.querySelector('.hour-hand');
    const fallbackEl = document.getElementById('clock-fallback');
    const fallbackTimeEl = fallbackEl ? fallbackEl.querySelector('.fallback-time') : null;

    function supportsCSS(prop, val) {
      if (window.CSS && typeof window.CSS.supports === 'function') {
        return window.CSS.supports(prop, val);
      }
      return false;
    }

    function setDate() {
      const now = new Date();
      const hasTransformSupport = supportsCSS('transform', 'rotate(0deg)');

      if (!hasTransformSupport) {
        document.documentElement.classList.add('no-transforms');
        if (fallbackTimeEl) {
          fallbackTimeEl.textContent = now.toLocaleTimeString();
        }
        return;
      }

      document.documentElement.classList.remove('no-transforms');

      const seconds = now.getSeconds();
      const secondsDegrees = ((seconds / 60) * 360) + 90;
      secondHand.style.transform = `rotate(${secondsDegrees}deg)`;

      const mins = now.getMinutes();
      const minsDegrees = ((mins / 60) * 360) + ((seconds / 60) * 6) + 90;
      minsHand.style.transform = `rotate(${minsDegrees}deg)`;

      const hour = now.getHours();
      const hourDegrees = ((hour / 12) * 360) + ((mins / 60) * 30) + 90;
      hourHand.style.transform = `rotate(${hourDegrees}deg)`;
    }

    setInterval(setDate, 1000);
    setDate();
  </script>
</body>
</html>
