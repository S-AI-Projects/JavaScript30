<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plain Text Rendering Companion</title>
  <style>
    body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 Arial, sans-serif; color: #17212b; }
    label { display: block; margin: 1rem 0 0.4rem; font-weight: 700; }
    textarea { box-sizing: border-box; width: 100%; min-height: 8rem; padding: 0.75rem; font: inherit; }
    #preview { min-height: 3rem; padding: 0.75rem; border: 1px solid #82909c; background: #f4f7f9; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Plain text rendering companion</h1>
    <p>This isolated page demonstrates rendering user text literally. Markdown and HTML are displayed as text; they are not interpreted.</p>
    <label for="message">Text to display</label>
    <textarea id="message" name="message" placeholder="Type a note"></textarea>
    <h2>Preview</h2>
    <p id="preview" role="status">Your text appears here.</p>
  </main>
  <script>
    const message = document.querySelector('#message');
    const preview = document.querySelector('#preview');

    message.addEventListener('input', () => {
      preview.textContent = message.value || 'Your text appears here.';
    });
  </script>
</body>
</html>
